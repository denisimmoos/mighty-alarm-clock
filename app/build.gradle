plugins {
    id 'com.android.application'
}

// The version comes from one name, e.g. "0.9.3-beta". A release workflow passes the git tag
// with -PappVersion=0.9.3-beta. The version code is derived from it and always goes up:
// (major*10000 + minor*100 + patch)*100 + stage, where stage is 10+n for alpha, 30+n for beta,
// 50+n for rc (n = the number after the label, 0 to 19) and 90 for the final version.
// So 0.9.3-beta -> 90330, 1.0.0-rc2 -> 1000052, 1.0.0 -> 1000090.
// (Releases up to 0.9.2-beta used a smaller scheme, so these codes are higher than all of them.)
def appVersionName = (project.findProperty("appVersion") ?: "0.9.5-beta").toString().replaceFirst(/^v/, "")

static int versionCodeFor(String name) {
    def m = name =~ /^(\d+)\.(\d+)\.(\d+)(?:-([A-Za-z]+)\.?(\d*))?$/
    if (!m.matches()) {
        throw new GradleException("Version must look like 1.2.3, 1.2.3-beta or 1.2.3-rc2, got: " + name)
    }
    def major = m.group(1) as int
    def minor = m.group(2) as int
    def patch = m.group(3) as int
    if (minor > 99 || patch > 99) {
        throw new GradleException("Minor and patch must be 0 to 99: " + name)
    }
    def label = m.group(4)?.toLowerCase()
    int stage = 90
    if (label != null) {
        def bases = [alpha: 10, beta: 30, rc: 50]
        if (!bases.containsKey(label)) {
            throw new GradleException("Label must be alpha, beta or rc: " + name)
        }
        int n = m.group(5) ? (m.group(5) as int) : 0
        if (n > 19) {
            throw new GradleException("The number after the label must be 0 to 19: " + name)
        }
        stage = bases[label] + n
    }
    return ((major * 10000 + minor * 100 + patch) * 100) + stage
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "redpantyhose.claude.mightycalendaralarm"
        minSdk = 23
        targetSdk = 36
        versionCode = versionCodeFor(appVersionName)
        versionName = appVersionName
    }

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file("$rootDir/keystore.jks")
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            } else {
                println "Keystore properties file not found. No signing configuration will be applied."
            }
        }
    }

    def commitNumber = 0

    def buildCommit = providers.exec {
        commandLine('git', 'rev-parse', '--short=7', 'HEAD')
    }.standardOutput.asText.get().trim()

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            // Keep release APKs bit-stable across machines (F-Droid reproducible builds).
            vcsInfo {
                include false
            }
            manifestPlaceholders = [appName: "@string/app_label_launcher"]
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.findByName("release")
            } else {
                signingConfig = null
            }
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "false"
            buildConfigField "String", "COMMIT_NUMBER", "\"\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            manifestPlaceholders = [appName: "@string/app_label_debug"]
            versionNameSuffix = "-debug-${buildCommit}"
            applicationIdSuffix = ".debug"
            buildConfigField "boolean", "IS_DEBUG_BUILD", "true"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "false"
            buildConfigField "String", "COMMIT_NUMBER", "\"\""
        }

        nightly {
            initWith release
            manifestPlaceholders = [appName: "@string/app_label_nightly"]
            versionNameSuffix = "-nightly-${commitNumber}-${buildCommit}"
            applicationIdSuffix = ".nightly"
            signingConfig = signingConfigs.debug
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "true"
            buildConfigField "String", "COMMIT_NUMBER", "\"${commitNumber}\""
        }
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            def versionName = android.defaultConfig.versionName
            def buildTypeConfig = android.buildTypes.findByName(variant.buildType)
            def versionNameSuffix = buildTypeConfig != null ? buildTypeConfig.versionNameSuffix : null
            def outputFileName

            if (variant.buildType == "nightly") {
                outputFileName = "MightyCalendarAlarms_${versionName}-nightly-${commitNumber}-${buildCommit}.apk"
            } else if (variant.buildType == "release") {
                def suffix = keystorePropertiesFile.exists() ? "" : "-unsigned"
                outputFileName = "MightyCalendarAlarms-v${versionName}${suffix}.apk"
            } else {
                outputFileName = "MightyCalendarAlarms_${versionName}${versionNameSuffix ?: ""}.apk"
            }

            variant.outputs.forEach { output ->
                output.outputFileName.set(outputFileName)
                if (variant.buildType == "debug") {
                    // Older debug builds used date-based version codes (202608001). Keep debug
                    // codes above them so a new debug build installs over an old one.
                    output.versionCode.set(300000000 + versionCodeFor(versionName))
                }
            }
        }
    }

    lintOptions {
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    namespace = 'com.best.deskclock'
}

// baseline.prof / ArtProfile generation is often non-deterministic across builds.
tasks.configureEach { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-common:1.10.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'androidx.test:core:1.6.1'
}
