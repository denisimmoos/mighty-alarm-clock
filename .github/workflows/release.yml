# Builds a signed release APK, creates the GitHub release and attaches the APK.
#
# Two ways to start it:
#  * Raise the default version in app/build.gradle (appVersion, e.g. "0.9.2-beta") and push to
#    feature/calendar-only. If the tag v<version> does not exist yet, this workflow creates the
#    tag and the release itself. Pushes that keep the version do nothing.
#  * Push a tag such as v1.0.0, or create a release with a new tag on GitHub.
# Versions with a dash (0.9.0-beta, 1.0.0-rc1) become pre-releases.
# The release text comes from docs/release-notes/v<version>.md when that file exists.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore.jks, base64 encoded
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_ALIAS          keyAlias from keystore.properties
#   KEY_PASSWORD       keyPassword from keystore.properties
name: Release

on:
  push:
    branches:
      - feature/calendar-only
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            NAME=$(sed -nE 's/.*findProperty\("appVersion"\) \?: "([^"]+)".*/\1/p' app/build.gradle)
            if [ -z "$NAME" ]; then
              echo "::error::Could not read the default appVersion from app/build.gradle"
              exit 1
            fi
            TAG="v$NAME"
            # Only a clear "not found" means the tag is new. Any other error stops the run, so an
            # existing release is never replaced by a build of another commit.
            CODE=$(gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null | head -1 | awk '{print $2}')
            if [ "$CODE" = "200" ]; then
              echo "Tag $TAG already exists: raise appVersion in app/build.gradle to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            elif [ "$CODE" = "404" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not check whether tag $TAG exists (HTTP ${CODE:-none})."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > keystore.properties

      - name: Run tests
        if: steps.version.outputs.release == 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PappVersion=${{ steps.version.outputs.name }}

      - name: Build signed release APK
        if: steps.version.outputs.release == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersion=${{ steps.version.outputs.name }}

      - name: Remove signing key
        if: always()
        run: rm -f keystore.jks keystore.properties

      - name: Create release and attach APK
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="app/build/outputs/apk/release/MightyCalendarAlarms-v${{ steps.version.outputs.name }}.apk"
          test -f "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release written by hand already exists: only add or replace the APK.
            gh release upload "$TAG" "$APK" --clobber
          else
            # Release text: docs/release-notes/<tag>.md if it exists, otherwise GitHub's list of
            # changes since the last release.
            NOTES="docs/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
            # Also creates the tag on this commit when it does not exist yet.
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Mighty Calendar Alarms $TAG" \
              "${NOTES_ARGS[@]}" ${{ steps.version.outputs.prerelease }}
          fi
