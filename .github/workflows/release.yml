# Builds a signed release APK when a version tag is pushed, e.g. v0.9.0-beta or v1.0.0,
# creates the GitHub release for that tag and attaches the APK.
# Tags with a dash (v0.9.0-beta, v1.0.0-rc1) become pre-releases.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore.jks, base64 encoded
#   KEYSTORE_PASSWORD  storePassword from keystore.properties
#   KEY_ALIAS          keyAlias from keystore.properties
#   KEY_PASSWORD       keyPassword from keystore.properties
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > keystore.properties

      - name: Run tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PappVersion=${{ steps.version.outputs.name }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersion=${{ steps.version.outputs.name }}

      - name: Remove signing key
        if: always()
        run: rm -f keystore.jks keystore.properties

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/MightyCalendarAlarms-v${{ steps.version.outputs.name }}.apk"
          test -f "$APK"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release written by hand already exists: only add or replace the APK.
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Mighty Calendar Alarms ${GITHUB_REF_NAME}" \
              --generate-notes ${{ steps.version.outputs.prerelease }}
          fi
